; Symbiosis AI - S10 ESP32 bench firmware.
; One source tree, five build environments (no divergent copies):
;   pio run -e bringup        I2C scan, MOSFET and input tests over serial   (hardware steps 1-8)
;   pio run -e sensor_test    print real sensor readings only                 (steps 4-5, 9)
;   pio run -e signing_test   firmware known-answer HMAC self-test            (step 10, gate H7)
;   pio run -e cloud_test     real signed telemetry to the API + replay probe (steps 11-12, gate H8)
;   pio run -e demo           sensors + local actuators + cloud telemetry     (hero scenario)
; Flash + monitor:  pio run -e demo -t upload && pio device monitor
; Toolchain is pinned: Arduino-ESP32 2.0.17 (platform espressif32 6.9.0). No third-party
; libraries: the three I2C sensors use small register-level drivers in src/sensors.cpp.

[platformio]
default_envs = demo

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
extra_scripts = pre:scripts/git_sha.py
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=1

[env:bringup]
build_flags = ${env.build_flags} -DSYM_MODE=1

[env:sensor_test]
build_flags = ${env.build_flags} -DSYM_MODE=2

[env:signing_test]
build_flags = ${env.build_flags} -DSYM_MODE=3

[env:cloud_test]
build_flags = ${env.build_flags} -DSYM_MODE=4 -DSYM_CLOUD_REPLAY_PROBE=1

[env:demo]
build_flags = ${env.build_flags} -DSYM_MODE=5
